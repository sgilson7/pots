<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Protection of the Spheres</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false" data-screen="title">
  <canvas id="view" aria-label="The battlefield"></canvas>
  <div id="minimap" aria-label="Minimap">
    <canvas id="minimap-ground"></canvas>
    <canvas id="minimap-top"></canvas>
  </div>
  <div id="ui"></div>
  <div id="tip" role="tooltip" hidden></div>
  <p id="notice" role="status" data-nogl="This game needs WebGL 2, which this browser does not offer."></p>
  <noscript><p>This game needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
